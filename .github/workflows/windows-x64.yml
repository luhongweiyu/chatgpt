name: Windows recovered build

on:
  push:
    branches: [hcbyj64-recovery]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            machine: "014C"
            dll: hcbyj32_recovered.dll
            artifact: hcbyj32-recovered-release
          - arch: x64
            machine: "8664"
            dll: hcbyj64.dll
            artifact: hcbyj64-release

    steps:
      - uses: actions/checkout@v4

      - name: Configure ${{ matrix.arch }}
        shell: pwsh
        run: cmake -S . -B build -A ${{ matrix.arch }}

      - name: Audit 416 APIs
        shell: pwsh
        run: python tools/audit_api.py

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Verify PE machine
        shell: pwsh
        run: |
          $dll = Resolve-Path "build/Release/${{ matrix.dll }}"
          $bytes = [IO.File]::ReadAllBytes($dll)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expected = [Convert]::ToUInt16("${{ matrix.machine }}", 16)
          if ($machine -ne $expected) {
            throw "Unexpected PE machine: 0x$($machine.ToString('X4')); expected 0x${{ matrix.machine }}"
          }
          Write-Host "Verified ${{ matrix.arch }} PE: $dll"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/Release/${{ matrix.dll }}
            build/Release/*.lib
            build/Release/hcbyj64_smoke.exe
